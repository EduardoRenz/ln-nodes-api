services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lightning
      POSTGRES_PASSWORD: lightning
      POSTGRES_DB: lightning
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lightning -d lightning"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PERSISTENCE: "${PERSISTENCE:-postgres}"
      DATABASE_URL: postgres://lightning:lightning@db:5432/lightning
      PORT: 3000
      IMPORT_INTERVAL_SECS: "${IMPORT_INTERVAL_SECS:-300}"
      MEMPOOL_API_URL: "${MEMPOOL_API_URL:-https://mempool.space/api/v1/lightning/nodes/rankings/connectivity}"
      RUST_LOG: "${RUST_LOG:-info}"
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
